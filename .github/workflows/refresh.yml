name: Daily GSC inventory refresh

on:
  schedule:
    # 10:00 UTC = 6:00 AM America/New_York (5:00 AM during DST). Runs daily.
    - cron: '0 10 * * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # so we can commit the fresh inventory.html back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Write GSC key file
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          if [ -z "$GSC_KEY_JSON" ]; then
            echo "::error::GSC_KEY_JSON secret is not set on the repo"
            exit 1
          fi
          printf '%s' "$GSC_KEY_JSON" > /tmp/gsc.json
          chmod 600 /tmp/gsc.json

      - name: Run refresh
        env:
          GSC_KEY_PATH: /tmp/gsc.json
        run: python3 refresh.py

      - name: Clean up key
        if: always()
        run: rm -f /tmp/gsc.json

      - name: Commit updated inventory
        run: |
          git config user.name  "gsc-inventory-bot"
          git config user.email "actions@github.com"
          git add inventory.html bucket-summary.txt history.json inventory-*.csv inventory-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily inventory refresh $(date -u +%Y-%m-%d)"
          git push
